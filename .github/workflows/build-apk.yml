name: Construire l'APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Construire
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: AlerteSilencieux
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publier en téléchargement direct (release "apk-latest")
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk AlerteSilencieux.apk
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest AlerteSilencieux.apk \
            --target "$GITHUB_SHA" \
            --title "Alerte Silencieux (dernière version)" \
            --notes "Construit depuis ${GITHUB_REF_NAME} (${GITHUB_SHA::7}). Téléchargez AlerteSilencieux.apk depuis le téléphone pour l'installer."
